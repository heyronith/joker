name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    env:
      TZ: America/New_York
      OPENAI_API_KEY: test-ci-key-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OS timezone data
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tzdata
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff
      - name: Ruff
        run: ruff check .
      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            -W error::pytest.PytestUnhandledThreadExceptionWarning \
            --tb=short | tee pytest-output.txt
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: pytest-output.txt
