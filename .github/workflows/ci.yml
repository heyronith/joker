name: ci

# Optional / manual only — local SHA-tied verification is the acceptance path.
# Do not treat push/PR GitHub Actions as a merge or phase gate.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    env:
      TZ: America/New_York
      OPENAI_API_KEY: test-ci-key-not-real
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OS timezone data
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tzdata
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff pytest-timeout
      - name: Ruff
        run: ruff check .
      - name: Pytest
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          # signal timeout (default) avoids join/to_thread deadlocks with thread method.
          # -r fE prints failed/error summaries even if a later timeout aborts the suite.
          pytest -q \
            --timeout=300 \
            -r fE \
            -W error::pytest.PytestUnhandledThreadExceptionWarning \
            -W error::ResourceWarning \
            --tb=short | tee pytest-output.txt
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: pytest-output.txt
