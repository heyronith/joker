[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joker"
version = "0.1.0"
description = "Local Mac-first TUI for AI-assisted SPY 0DTE options trading research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "joker contributors" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.47",
    "sqlmodel>=0.0.16",
    "openai>=1.30",
    "httpx>=0.27",
    "exchange-calendars>=4.5",
    "aiosqlite>=0.20",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[project.scripts]
joker = "joker.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["joker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Keep one event loop for the whole session so short-lived aiosqlite workers are
# not racing pytest-asyncio function-scoped loop.close() (CPython 3.11/3.12 CI).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
    # aiosqlite worker must not outlive the owning loop (CPython 3.12 CI gate).
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Critical correctness checks for CI. Broader style cleanup is tracked separately
# so Task 1 remediation is not blocked by pre-existing formatting debt.
select = ["E9", "F63", "F7", "F82"]
