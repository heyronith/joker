[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joker"
version = "0.1.0"
description = "Local Mac-first TUI for AI-assisted SPY 0DTE options trading research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "joker contributors" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.47",
    "sqlmodel>=0.0.16",
    "openai>=1.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
joker = "joker.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["joker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
